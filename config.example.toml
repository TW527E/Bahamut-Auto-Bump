[account]
username = "your-bahamut-account"
password = "your-bahamut-password"
# Base32 TOTP secret from the account's two-factor setup (spaces are accepted).
totp_secret = "JBSWY3DPEHPK3PXP"

[thread]
url = "https://forum.gamer.com.tw/C.php?bsn=00000&snA=000000"
content_template = "頂🆙！\n（{timestamp}）"

[selectors]
# Keep these configurable because Bahamut may change its markup.
login_url = "https://user.gamer.com.tw/login.php"
username = "#form-login input[name='userid']"
password = "#form-login input[name='password']"
totp = "#input-2sa, input[name='twoStepAuth']"
login_submit = "#btn-login"
totp_submit = "#btn-login, button[type='submit'], input[type='submit']"
logout = "a[href*='logout'], [data-action='logout']"
post_selector = "#BH-master > section[id^='post_'] .c-post"
post_time_selector = ".edittime"
editor = "#editor"
post_submit = "[data-action='quick-post'], #quick-post, button[type='submit']"

[browser]
engine = "obscura"
headless = true
navigation_timeout_ms = 30000
# Obscura is a standalone Rust browser; no Chromium binary is needed.
# obscura_binary = "/opt/obscura/obscura"
# obscura_port = 9222
# obscura_storage_dir = "/opt/Bahamut-Auto-Bump/obscura-profile"
# obscura_stealth = false
# obscura_start_timeout_seconds = 20
# Optional Playwright storage state exported by export_bahamut_session.py.
# Use an absolute path on the Linux host and chmod 600 on this file.
# storage_state = "/opt/bahamut-auto-bump/bahamut-session.json"
# Optional: set this only when Chromium is installed outside Playwright.
# executable_path = "/usr/bin/chromium"

[schedule]
timezone = "Asia/Taipei"
time = "09:00"
retry_interval_seconds = 900
state_file = "state.json"

[telegram]
# Create a bot with @BotFather. Add it as an administrator of the target
# channel so it can publish messages. Channel ids usually look like -100....
bot_token = "123456789:replace-with-your-bot-token"
target_chat_id = "-1001234567890"
# Only this administrator's chat may change notification settings by command.
admin_chat_id = "123456789"
state_file = "telegram_state.json"
