[thread]
url = "https://forum.gamer.com.tw/C.php?bsn=00000&snA=000000"
content_template = "頂🆙！\n（{timestamp}）"

[selectors]
# Keep these configurable because Bahamut may change its markup.
login_trigger = "a.main-nav__link[onclick*='requireLoginIframe'], a[onclick*='requireLoginIframe']"
login_frame = "iframe[src*='login.php'], dialog iframe"
username = "#form-login input[name='userid'], input[name='userid']"
password = "#form-login input[name='password'], input[name='password']"
totp = "#input-2sa, input[name='twoStepAuth'], input[name='otp'], input[name='code']"
login_submit = "#form-login button[type='submit'], #form-login input[type='submit'], #btn-login"
logged_out_selector = "#BH-top-data a[href*='login.php'], a.main-nav__link[onclick*='requireLoginIframe'], a[onclick*='requireLoginIframe']"
login_onboarding = "#driver-popover-content"
login_onboarding_close = "#driver-popover-content button[aria-label='Close'], #driver-popover-content .driver-popover-close-btn, #driver-popover-content button"
post_selector = "#BH-master > section[id^='post_'] .c-post"
post_time_selector = ".edittime"
editor = "#editor"
post_submit = "[data-action='quick-post'], #quick-post, button[type='submit']"

[account]
# If storage_state is missing or expired, the script logs in by clicking the
# login link on https://www.gamer.com.tw/ and filling the resulting iframe.
# Keep this file mode 600 and never commit it.
username = ""
password = ""
totp_secret = ""

[browser]
headless = true
navigation_timeout_ms = 30000
# Use the system-installed Google Chrome Stable. This does not use or download
# Playwright's Chromium for Testing build.
channel = "chrome"
# Optional authenticated Playwright storage state. It is preferred when valid;
# an expired or missing file falls back to the homepage login flow.
storage_state = "/opt/Bahamut-Auto-Bump/bahamut-session.json"
# Homepage used for automatic login. Do not replace this with login.php.
homepage_url = "https://www.gamer.com.tw/"
# Optional explicit path instead of channel detection:
# executable_path = "/usr/bin/google-chrome-stable"

[schedule]
timezone = "Asia/Taipei"
time = "09:00"
retry_interval_seconds = 900
state_file = "state.json"

[cleanup]
# Keep floor 1 forever. Set enabled=true to remove the previous bump after a
# newly submitted bump has been verified. Live deletion requires dry_run=false
# (or the explicit --apply flag for --cleanup).
enabled = false
dry_run = true
keep_latest_replies = 1
interval_seconds = 5
after_bump_delay_seconds = 5

[telegram]
# Create a bot with @BotFather. Add it as an administrator of the target
# channel so it can publish messages. Channel ids usually look like -100....
bot_token = "123456789:replace-with-your-bot-token"
target_chat_id = "-1001234567890"
# Only this administrator's chat may change notification settings by command.
admin_chat_id = "123456789"
state_file = "telegram_state.json"
# The service checks Telegram this often while waiting for the next scheduled
# run. Lower values make commands respond faster but create more API requests.
poll_interval_seconds = 2
